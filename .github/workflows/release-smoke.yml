name: Release consumer smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release selection
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(<action-version.txt)" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Validate and verify the synthetic consumer dataset
        uses: ./
        with:
          path: examples/basic-lineage
