name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Check Linux GLIBC compatibility
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/check-linux-glibc-compatibility.sh target/release/lineageguard

  action-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test checksum-verified Action wrapper
        run: bash scripts/test-lineageguard-action.sh
      - name: Prepare artifact action compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/lineageguard-artifact-fixtures"
          mkdir -p "$fixture_root"
          printf '%s\n' linux-x86_64 > "$fixture_root/linux-x86_64.txt"
          printf '%s\n' macos-aarch64 > "$fixture_root/macos-aarch64.txt"
          printf '%s\n' windows-x86_64 > "$fixture_root/windows-x86_64.txt"
      - name: Upload Linux artifact fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lineageguard-smoke-linux-x86_64
          path: ${{ runner.temp }}/lineageguard-artifact-fixtures/linux-x86_64.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload macOS artifact fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lineageguard-smoke-macos-aarch64
          path: ${{ runner.temp }}/lineageguard-artifact-fixtures/macos-aarch64.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload Windows artifact fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lineageguard-smoke-windows-x86_64
          path: ${{ runner.temp }}/lineageguard-artifact-fixtures/windows-x86_64.txt
          if-no-files-found: error
          retention-days: 1
      - name: Download and merge platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lineageguard-smoke-*
          merge-multiple: true
          path: ${{ runner.temp }}/lineageguard-artifacts-downloaded
      - name: Verify downloaded artifact fixtures
        shell: bash
        env:
          DOWNLOADED_ROOT: ${{ runner.temp }}/lineageguard-artifacts-downloaded
        run: |
          set -euo pipefail
          diff -u \
            <(printf '%s\n' linux-x86_64.txt macos-aarch64.txt windows-x86_64.txt | LC_ALL=C sort) \
            <(find "$DOWNLOADED_ROOT" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          for platform in linux-x86_64 macos-aarch64 windows-x86_64; do
            printf '%s\n' "$platform" | cmp -s - "$DOWNLOADED_ROOT/$platform.txt"
          done
