[package]
name = "lineageguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Validate local artifact provenance, identity, and lineage"
license = "Apache-2.0"
repository = "https://github.com/KageRyo/LineageGuard"

[[bin]]
name = "lineageguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3"
